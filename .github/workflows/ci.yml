name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phase-a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # R9: run logs carry the provenance (commit, lock hash, interpreter).
      - name: Provenance
        run: |
          echo "commit: $(git rev-parse HEAD)"
          echo "sha256(uv.lock): $(sha256sum uv.lock | cut -d' ' -f1)"
          uv run python --version

      - name: Sync pinned environment
        run: |
          uv sync --frozen
          uv lock --check

      - name: Tests (instrument, surrogates, theory checks)
        run: uv run pytest

      - name: Symbolic verification of the [P] propositions
        run: |
          uv run python theory/checks/verify_math.py
          uv run python theory/checks/verify_scope_math.py
          uv run python theory/checks/verify_spec_math.py
          # omega_sweeps runs the knife-edge dynamics of the Omega rule with exact gradients (Omega > 1 slides away), where
          # CPU round-off differs across machines: CI compares words (every label) exactly and numbers within tolerance (R9)
          uv run python theory/checks/omega_sweeps.py > /tmp/om.txt && uv run python scripts/cmp_tol.py /tmp/om.txt theory/checks/omega_sweeps.txt
          uv run python theory/checks/omega_vs_methods.py > /tmp/ovm.txt && cmp /tmp/ovm.txt theory/checks/omega_vs_methods.txt
          uv run python theory/checks/omega_reprocessed.py 2>/dev/null > /tmp/orp.txt && cmp /tmp/orp.txt theory/checks/omega_reprocessed.txt
          uv run python theory/checks/fed_heterogeneous_v1.py 2>/dev/null > /tmp/fed1.txt && cmp /tmp/fed1.txt theory/checks/fed_heterogeneous_v1.txt
          uv run python theory/checks/fed_heterogeneous.py 2>/dev/null > /tmp/fed2.txt && cmp /tmp/fed2.txt theory/checks/fed_heterogeneous.txt
          uv run python ontology/checks/tense_gate.py 2>/dev/null > /tmp/tense.txt && cmp /tmp/tense.txt ontology/checks/tense_gate.txt
          uv run python ontology/checks/self_model.py 2>/dev/null > /tmp/selfm.txt && cmp /tmp/selfm.txt ontology/checks/self_model.txt
          uv run python ontology/checks/off_switch.py 2>/dev/null > /tmp/offsw.txt && cmp /tmp/offsw.txt ontology/checks/off_switch.txt
          uv run python AI_Safety/checks/exact_mdp.py 2>/dev/null > /tmp/ais_exact_mdp.txt && cmp /tmp/ais_exact_mdp.txt AI_Safety/checks/exact_mdp.txt
          uv run python AI_Safety/checks/off_switch_game.py 2>/dev/null > /tmp/ais_off_switch_game.txt && cmp /tmp/ais_off_switch_game.txt AI_Safety/checks/off_switch_game.txt
          uv run python AI_Safety/checks/sensitivity.py 2>/dev/null > /tmp/ais_sensitivity.txt && cmp /tmp/ais_sensitivity.txt AI_Safety/checks/sensitivity.txt
          uv run python AI_Safety/checks/timecourse.py 2>/dev/null > /tmp/ais_timecourse.txt && cmp /tmp/ais_timecourse.txt AI_Safety/checks/timecourse.txt
          uv run python AI_Safety/checks/combined.py 2>/dev/null > /tmp/ais_combined.txt && cmp /tmp/ais_combined.txt AI_Safety/checks/combined.txt
          uv run python AI_Safety/checks/scale.py 2>/dev/null > /tmp/ais_scale.txt && cmp /tmp/ais_scale.txt AI_Safety/checks/scale.txt
          uv run python AI_Safety/checks/self_through_time.py 2>/dev/null > /tmp/ais_stt.txt && cmp /tmp/ais_stt.txt AI_Safety/checks/self_through_time.txt
          uv run python AI_Safety/checks/continual_safety.py 2>/dev/null > /tmp/ais_cs.txt && cmp /tmp/ais_cs.txt AI_Safety/checks/continual_safety.txt
          uv run python AI_Safety/build/make_figures.py 2>/dev/null > /tmp/aisf.txt && cmp /tmp/aisf.txt AI_Safety/figures/figures.txt
          uv run --group docs python AI_Safety/build/build_pdf.py > /tmp/pdf.log 2>&1 || { tail -40 /tmp/pdf.log; exit 1; }
          uv run python Safe_and_Continual/checks/roundoff_audit.py 2>/dev/null > /tmp/sac_audit.txt && cmp /tmp/sac_audit.txt Safe_and_Continual/checks/roundoff_audit.txt
          uv run python Safe_and_Continual/build/make_figures.py 2>/dev/null > /tmp/sac_figs.txt && cmp /tmp/sac_figs.txt Safe_and_Continual/figures/figures.txt
          uv run --group docs python Safe_and_Continual/build/build_pdf.py > /tmp/pdf.log 2>&1 || { tail -40 /tmp/pdf.log; exit 1; }
          uv run python studies/scl1/scl1_score.py math 2>/dev/null > /tmp/scl1_math.txt && cmp /tmp/scl1_math.txt Safe_and_Continual/checks/scl1_math.txt
          uv run python runs/scl1/frozen/scl1_score.py gate 2>/dev/null > /tmp/scl1_gate.txt && cmp /tmp/scl1_gate.txt prereg/scl1/gate_SCL.txt
          uv run python runs/scl1/counts.py 2>/dev/null > /tmp/scl1_counts.txt && cmp /tmp/scl1_counts.txt runs/scl1/counts.txt
          uv run python runs/scl2/frozen/scl2_score.py gate 2>/dev/null > /tmp/scl2_gate.txt && cmp /tmp/scl2_gate.txt prereg/scl2/gate_SCL2.txt
          uv run python runs/scl2/counts.py 2>/dev/null > /tmp/scl2_counts.txt && cmp /tmp/scl2_counts.txt runs/scl2/counts.txt
          uv run python runs/scl3/frozen/scl3_score.py gate 2>/dev/null > /tmp/scl3_gate.txt && cmp /tmp/scl3_gate.txt prereg/scl3/gate_SCL3.txt
          uv run python runs/scl3/counts.py 2>/dev/null > /tmp/scl3_counts.txt && cmp /tmp/scl3_counts.txt runs/scl3/counts.txt
          uv run python "Alexander Plan/model/projections.py" 2>/dev/null > /tmp/ap_proj.txt && cmp /tmp/ap_proj.txt "Alexander Plan/model/projections.txt"
          uv run python "Alexander Plan/model/cl_patent.py" 2>/dev/null > /tmp/ap_clp.txt && cmp /tmp/ap_clp.txt "Alexander Plan/model/cl_patent.txt"
          uv run python "Alexander Plan/build/make_figures.py" 2>/dev/null > /tmp/ap_figs.txt && cmp /tmp/ap_figs.txt "Alexander Plan/figures/figures.txt"
          uv run --group docs python "Alexander Plan/build/build_pdf.py" > /tmp/pdf.log 2>&1 || { tail -40 /tmp/pdf.log; exit 1; }
          uv run python Epistemic_Review/checks/ladder.py 2>/dev/null > /tmp/er_ladder.txt && cmp /tmp/er_ladder.txt Epistemic_Review/checks/ladder.txt
          uv run python Epistemic_Review/build/make_figures.py 2>/dev/null > /tmp/er_figs.txt && cmp /tmp/er_figs.txt Epistemic_Review/figures/figures.txt
          uv run --group docs python Epistemic_Review/build/build_pdf.py > /tmp/pdf.log 2>&1 || { tail -40 /tmp/pdf.log; exit 1; }
          uv run python Continuous_Learning/checks/adam_checks.py 2>/dev/null > /tmp/cl_adam.txt && cmp /tmp/cl_adam.txt Continuous_Learning/checks/adam_checks.txt
          uv run python Continuous_Learning/checks/adam_checks_2.py 2>/dev/null > /tmp/cl_adam2.txt && cmp /tmp/cl_adam2.txt Continuous_Learning/checks/adam_checks_2.txt
          uv run python Continuous_Learning/checks/adam_checks_3.py 2>/dev/null > /tmp/cl_adam3.txt && cmp /tmp/cl_adam3.txt Continuous_Learning/checks/adam_checks_3.txt
          uv run python Continuous_Learning/checks/pareto_identities.py 2>/dev/null > /tmp/cl_pareto.txt && uv run python scripts/cmp_tol.py /tmp/cl_pareto.txt Continuous_Learning/checks/pareto_identities.txt
          uv run python Continuous_Learning/checks/results_vs_literature.py 2>/dev/null > /tmp/cl_rvl.txt && cmp /tmp/cl_rvl.txt Continuous_Learning/checks/results_vs_literature.txt
          uv run python Continuous_Learning/FOREVER/checks/forever_checks.py 2>/dev/null > /tmp/cl_forever.txt && uv run python scripts/cmp_tol.py /tmp/cl_forever.txt Continuous_Learning/FOREVER/checks/forever_checks.txt
          (cd Continuous_Learning/FOREVER/checks && uv run python pause_checks.py 2>/dev/null > /tmp/cl_pause.txt) && cmp /tmp/cl_pause.txt Continuous_Learning/FOREVER/checks/pause_checks.txt
          uv run --group docs python Continuous_Learning/build/build_adam_pdf.py > /tmp/pdf.log 2>&1 || { tail -40 /tmp/pdf.log; exit 1; }
          uv run --group docs python Continuous_Learning/build/build_frontier_pdf.py > /tmp/pdf.log 2>&1 || { tail -40 /tmp/pdf.log; exit 1; }
          uv run python Adam_SGD/checks/assumptions.py 2>/dev/null > /tmp/as1.txt && cmp /tmp/as1.txt Adam_SGD/checks/assumptions.txt
          uv run python Adam_SGD/checks/drift_battery.py 2>/dev/null > /tmp/as2.txt && cmp /tmp/as2.txt Adam_SGD/checks/drift_battery.txt
          uv run python Adam_SGD/checks/drift_battery_2.py 2>/dev/null > /tmp/as3.txt && cmp /tmp/as3.txt Adam_SGD/checks/drift_battery_2.txt
          uv run python Adam_SGD/checks/mechanism.py 2>/dev/null > /tmp/as4.txt && cmp /tmp/as4.txt Adam_SGD/checks/mechanism.txt
          uv run --group docs python Adam_SGD/build/build_pdf.py > /tmp/pdf.log 2>&1 || { tail -40 /tmp/pdf.log; exit 1; }
          uv run python Rupture_Detection/checks/rupture_checks.py 2>/dev/null > /tmp/rd.txt && cmp /tmp/rd.txt Rupture_Detection/checks/rupture_checks.txt
          uv run python Regeneration_Law/checks/math_checks.py 2>/dev/null > /tmp/rl_math.txt && cmp /tmp/rl_math.txt Regeneration_Law/checks/math_checks.txt
          uv run python Regeneration_Law/checks/operational_checks.py 2>/dev/null > /tmp/rl_op.txt && cmp /tmp/rl_op.txt Regeneration_Law/checks/operational_checks.txt
          uv run python studies/rlaw/loader_check.py 2>/dev/null > /tmp/rl_lc.txt && cmp /tmp/rl_lc.txt prereg/rlaw/loader_check.txt
          uv run python runs/rlaw/summary.py 2>/dev/null > /tmp/rl_sum.txt && cmp /tmp/rl_sum.txt runs/rlaw/summary.txt
          uv run python Maps_and_Territories/checks/performativity.py 2>/dev/null > /tmp/mt1.txt && uv run python scripts/cmp_tol.py /tmp/mt1.txt Maps_and_Territories/checks/performativity.txt
          uv run python Maps_and_Territories/checks/performativity_2.py 2>/dev/null > /tmp/mt2.txt && uv run python scripts/cmp_tol.py /tmp/mt2.txt Maps_and_Territories/checks/performativity_2.txt
          uv run --group docs python Maps_and_Territories/build/build_pdf.py > /tmp/pdf.log 2>&1 || { tail -40 /tmp/pdf.log; exit 1; }
          uv run --group docs python AI_Safety/build/build_review_pdf.py > /tmp/pdf.log 2>&1 || { tail -40 /tmp/pdf.log; exit 1; }
          uv run --group docs python Empty_Centre/build/build_pdf.py > /tmp/pdf.log 2>&1 || { tail -40 /tmp/pdf.log; exit 1; }
          uv run --group docs python Rupture_Detection/build/build_pdf.py > /tmp/pdf.log 2>&1 || { tail -40 /tmp/pdf.log; exit 1; }
          uv run python theory/retrodictions/crr_retrodictions.py > /tmp/retro.txt && cmp /tmp/retro.txt theory/retrodictions/crr_retrodictions.txt
          uv run python theory/retrodictions/sharp_claims.py > /tmp/sharp.txt && cmp /tmp/sharp.txt theory/retrodictions/sharp_claims.txt
          uv run python theory/retrodictions/bio_retrodictions.py > /tmp/bio.txt && cmp /tmp/bio.txt theory/retrodictions/bio_retrodictions.txt
          uv run python theory/retrodictions/ei_networks.py > /tmp/ei.txt && cmp /tmp/ei.txt theory/retrodictions/ei_networks.txt
          uv run python theory/retrodictions/driven_systems.py > /tmp/drv.txt && cmp /tmp/drv.txt theory/retrodictions/driven_systems.txt
          uv run python theory/retrodictions/cognitive_collective.py > /tmp/cc.txt && cmp /tmp/cc.txt theory/retrodictions/cognitive_collective.txt
          uv run python theory/retrodictions/wild_systems.py > /tmp/wild.txt && cmp /tmp/wild.txt theory/retrodictions/wild_systems.txt
          uv run python theory/retrodictions/twenty_systems.py > /tmp/t20.txt && cmp /tmp/t20.txt theory/retrodictions/twenty_systems.txt
          uv run python theory/retrodictions/emptiness.py > /tmp/emp.txt && cmp /tmp/emp.txt theory/retrodictions/emptiness.txt
          uv run python theory/retrodictions/shannon.py > /tmp/sh.txt && cmp /tmp/sh.txt theory/retrodictions/shannon.txt
          uv run python theory/retrodictions/loop_gravity.py > /tmp/lqg.txt && cmp /tmp/lqg.txt theory/retrodictions/loop_gravity.txt
          uv run python theory/retrodictions/synthesis.py > /tmp/syn.txt && cmp /tmp/syn.txt theory/retrodictions/synthesis.txt
          for f in theory/retrodictions/synthesis_batches/batch_*.py; do [ -e "$f" ] || continue; uv run python "$f" > /tmp/b.txt && cmp /tmp/b.txt "${f%.py}.txt" || exit 1; done
          uv run python theory/retrodictions/synthesis_batches/build_queue.py > /tmp/q.md && cmp /tmp/q.md theory/retrodictions/synthesis_batches/QUEUE.md
          uv run python theory/retrodictions/synthesis_batches/literature_check.py > /tmp/lc.txt && cmp /tmp/lc.txt theory/retrodictions/synthesis_batches/literature_check.txt
          uv run python docs/pedagogy/build_elegance_ledger.py > /tmp/e.md && cmp /tmp/e.md docs/pedagogy/ELEGANCE_LEDGER.md
          uv run python ontology/checks/cut_on_a_machine.py > /tmp/o.txt && cmp /tmp/o.txt ontology/checks/cut_on_a_machine.txt
          uv run python ontology/checks/turing_safety_ingression.py > /tmp/o2.txt && cmp /tmp/o2.txt ontology/checks/turing_safety_ingression.txt
          uv run python ontology/checks/genesis_from_emptiness.py > /tmp/o3.txt && cmp /tmp/o3.txt ontology/checks/genesis_from_emptiness.txt
          uv run python ontology/checks/delta_now.py 2>/dev/null > /tmp/o4.txt && cmp /tmp/o4.txt ontology/checks/delta_now.txt
          uv run python runs/eq3/frozen/eq3_score.py smoke > /tmp/s3.txt && cmp /tmp/s3.txt prereg/eq3/smoke.txt
          uv run python runs/eq3/frozen/eq3_score.py smokefull --out /tmp/eq3_smokefull.jsonl 2>/dev/null > /tmp/s3f.txt && cmp /tmp/s3f.txt prereg/eq3/smokefull.txt
          uv run python runs/eq4/frozen/eq4_score.py smoke > /tmp/s4.txt && cmp /tmp/s4.txt prereg/eq4/smoke.txt
          uv run python runs/eq4/frozen/eq4_score.py smokefull --out /tmp/eq4_smokefull.jsonl 2>/dev/null > /tmp/s4f.txt && cmp /tmp/s4f.txt prereg/eq4/smokefull.txt
          uv run python runs/sec1/frozen/sec1_score.py smoke > /tmp/sec1s.txt && cmp /tmp/sec1s.txt prereg/sec1/smoke.txt
          uv run python runs/sec1/frozen/sec1_score.py gate > /tmp/sec1g.txt && cmp /tmp/sec1g.txt prereg/sec1/gate_SEC.txt
          uv run python runs/bayes1/frozen/bayes1_score.py gate 2>/dev/null > /tmp/b1g.txt && cmp /tmp/b1g.txt prereg/bayes1/gate_BAYES.txt
          uv run python runs/bayes1/frozen/bayes1_score.py smoke 2>/dev/null > /tmp/b1s.txt && cmp /tmp/b1s.txt prereg/bayes1/smoke.txt
          uv run python runs/bayes1/frozen/bayes1_score.py smokefull --out /tmp/bayes1_smokefull.jsonl 2>/dev/null > /tmp/b1sf.txt && cmp /tmp/b1sf.txt prereg/bayes1/smokefull.txt
          uv run python runs/t1x/frozen/t1x_score.py smoke 2>/dev/null > /tmp/t1s.txt && cmp /tmp/t1s.txt prereg/t1x/smoke.txt
          uv run python runs/t1x/frozen/t1x_score.py smokefull --out /tmp/t1x_smokefull.jsonl 2>/dev/null > /tmp/t1sf.txt && cmp /tmp/t1sf.txt prereg/t1x/smokefull.txt
          uv run python runs/t1x2/frozen/t1x2_score.py smoke 2>/dev/null > /tmp/t12s.txt && cmp /tmp/t12s.txt prereg/t1x2/smoke.txt
          uv run python runs/t1x2/frozen/t1x2_score.py smokefull --out /tmp/t1x2_smokefull.jsonl 2>/dev/null > /tmp/t12sf.txt && cmp /tmp/t12sf.txt prereg/t1x2/smokefull.txt
          uv run python Continuous_Learning/build/make_figures.py 2>/dev/null > /tmp/cl.txt && cmp /tmp/cl.txt Continuous_Learning/figures/figures.txt
          uv run --group docs python Continuous_Learning/build/build_pdf.py > /tmp/pdf.log 2>&1 || { tail -40 /tmp/pdf.log; exit 1; }
          uv run python crr_retrodictions.py > /tmp/retro2.txt && diff <(grep -o 'verdict [A-Z]*' /tmp/retro2.txt) <(grep -o 'verdict [A-Z]*' runs/phaseA/crr_retrodictions.txt)

      - name: Surrogate gates must read GATE OPEN
        run: |
          uv run python -m crr.surrogates.gate L5
          uv run python -m crr.surrogates.gate CUT
          uv run python -m crr.surrogates.gate T1
          uv run python -m crr.surrogates.gate EQ
          uv run python -m crr.surrogates.gate EQ2
          uv run python -m crr.surrogates.gate EQB
          uv run python -m crr.surrogates.gate EQBM
