[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "crr-validation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "sympy>=1.13",
  "pytest>=8",
  "opentimestamps-client>=0.7",
  "pyreadr>=0.5",
  "rdata>=0.11",
  "wfdb>=4.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/crr"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[dependency-groups]
docs = [
    "fpdf2>=2.8.8",
    "pypdfium2>=5.13.0",
]
